<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="800" fill="#ffffff"/>
  <text x="30" y="42" font-size="18" font-weight="bold" fill="#1f2d3d">Schéma de données</text>
  <text x="30" y="64" font-size="13" fill="#4a5a6a">MIMIC-IV demo : antibiotiques et microbiologie</text>

  <!-- Liens -->
  <g stroke="#34495e" stroke-width="2" fill="none">
    <path d="M500,88 V200"/>
    <path d="M500,276 V400"/>
    <path d="M400,238 H160 V380"/>
    <path d="M600,238 H820 V400"/>
    <path d="M160,474 V580"/>
    <path d="M400,630 H260"/>
    <path d="M600,59 H920 V400" stroke-dasharray="7 5"/>
  </g>

  <!-- Étiquettes des liens -->
  <g font-size="12" fill="#1f2d3d">
    <text x="510" y="148">subject_id</text>
    <text x="510" y="106">1</text>
    <text x="510" y="194">N</text>

    <text x="510" y="342">hadm_id</text>
    <text x="510" y="294">1</text>
    <text x="510" y="394">N</text>

    <text x="280" y="231" text-anchor="middle">hadm_id</text>
    <text x="384" y="231" text-anchor="end">1</text>
    <text x="168" y="372">N</text>

    <text x="710" y="257" text-anchor="middle">hadm_id (peut être vide)</text>
    <text x="608" y="231">0..1</text>
    <text x="828" y="392">N</text>

    <text x="172" y="532">stay_id</text>
    <text x="168" y="498">1</text>
    <text x="168" y="574">N</text>

    <text x="327" y="622" text-anchor="middle">itemid</text>
    <text x="388" y="622" text-anchor="end">1</text>
    <text x="268" y="622">N</text>

    <text x="760" y="51" text-anchor="middle">subject_id (prélèvements sans hadm_id)</text>
    <text x="608" y="53">1</text>
    <text x="928" y="392">N</text>
  </g>

  <!-- PATIENTS -->
  <rect x="400" y="30" width="200" height="58" fill="#f2f6fa" stroke="#1f4e79" stroke-width="2"/>
  <rect x="400" y="30" width="200" height="30" fill="#1f4e79"/>
  <text x="500" y="51" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">PATIENTS</text>
  <text x="412" y="79" font-size="13" fill="#1f2d3d">subject_id</text>

  <!-- ADMISSIONS -->
  <rect x="400" y="200" width="200" height="76" fill="#f2f6fa" stroke="#1f4e79" stroke-width="2"/>
  <rect x="400" y="200" width="200" height="30" fill="#1f4e79"/>
  <text x="500" y="221" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">ADMISSIONS</text>
  <text x="412" y="249" font-size="13" fill="#1f2d3d">hadm_id</text>
  <text x="412" y="267" font-size="13" fill="#1f2d3d">subject_id</text>

  <!-- PRESCRIPTIONS -->
  <rect x="400" y="400" width="200" height="76" fill="#f2f6fa" stroke="#1f4e79" stroke-width="2"/>
  <rect x="400" y="400" width="200" height="30" fill="#1f4e79"/>
  <text x="500" y="421" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">PRESCRIPTIONS</text>
  <text x="412" y="449" font-size="13" fill="#1f2d3d">hadm_id</text>
  <text x="412" y="467" font-size="13" fill="#1f2d3d">subject_id</text>

  <!-- ICUSTAYS -->
  <rect x="60" y="380" width="200" height="94" fill="#f2f6fa" stroke="#1f4e79" stroke-width="2"/>
  <rect x="60" y="380" width="200" height="30" fill="#1f4e79"/>
  <text x="160" y="401" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">ICUSTAYS</text>
  <text x="72" y="429" font-size="13" fill="#1f2d3d">stay_id</text>
  <text x="72" y="447" font-size="13" fill="#1f2d3d">hadm_id</text>
  <text x="72" y="465" font-size="13" fill="#1f2d3d">subject_id</text>

  <!-- MICROBIOLOGYEVENTS -->
  <rect x="690" y="400" width="260" height="76" fill="#f2f6fa" stroke="#1f4e79" stroke-width="2"/>
  <rect x="690" y="400" width="260" height="30" fill="#1f4e79"/>
  <text x="820" y="421" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">MICROBIOLOGYEVENTS</text>
  <text x="702" y="449" font-size="13" fill="#1f2d3d">hadm_id (peut être vide)</text>
  <text x="702" y="467" font-size="13" fill="#1f2d3d">subject_id</text>

  <!-- INPUTEVENTS -->
  <rect x="60" y="580" width="200" height="112" fill="#f2f6fa" stroke="#1f4e79" stroke-width="2"/>
  <rect x="60" y="580" width="200" height="30" fill="#1f4e79"/>
  <text x="160" y="601" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">INPUTEVENTS</text>
  <text x="72" y="629" font-size="13" fill="#1f2d3d">stay_id</text>
  <text x="72" y="647" font-size="13" fill="#1f2d3d">hadm_id</text>
  <text x="72" y="665" font-size="13" fill="#1f2d3d">subject_id</text>
  <text x="72" y="683" font-size="13" fill="#1f2d3d">itemid</text>

  <!-- D_ITEMS -->
  <rect x="400" y="600" width="200" height="58" fill="#f2f6fa" stroke="#5d6d7e" stroke-width="2"/>
  <rect x="400" y="600" width="200" height="30" fill="#5d6d7e"/>
  <text x="500" y="621" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">D_ITEMS</text>
  <text x="412" y="649" font-size="13" fill="#1f2d3d">itemid</text>

  <!-- Notes -->
  <g font-size="12" fill="#2c3e50">
    <text x="30" y="735">Trait plein : lien par clé (1 → N). Pointillé : lien optionnel (prélèvements sans hospitalisation, rattachés au patient).</text>
    <text x="30" y="755">Unité d'analyse : l'admission (hadm_id). Agréger chaque table au niveau hadm_id avant de joindre (évite l'explosion de lignes).</text>
    <text x="30" y="775">prescriptions = ce qui a été prescrit (toute l'hospitalisation) ; inputevents = ce qui a été administré (réanimation seule) : ne pas additionner.</text>
  </g>
</svg>
